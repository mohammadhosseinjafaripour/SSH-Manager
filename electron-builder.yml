appId: app.sshvault.desktop
productName: SSH Vault
copyright: MIT
directories:
  output: release
  buildResources: build
files:
  - out/**
  - "!**/.vscode/*"
  - "!src/*"
  - "!node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
asarUnpack:
  - resources/**
  - node_modules/@node-rs/**
win:
  # icon.ico is generated by electron-builder from build/icon.png
  # (NSIS rejects all-PNG .ico files produced by png-to-ico)
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: true
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-${version}-setup.${ext}
portable:
  artifactName: ${productName}-${version}-portable.${ext}
afterPack: ./scripts/fuses.cjs
