appId: app.sshvault.desktop
# Auto-update source. electron-builder writes the repo into app-update.yml inside
# the package and generates latest.yml next to the installer; publishing a
# GitHub Release with those files is all the client needs.
publish:
  provider: github
  owner: mohammadhosseinjafaripour
  repo: SSH-Manager
  releaseType: release
productName: SSH Vault
copyright: MIT
directories:
  output: release
  buildResources: build
files:
  - out/**
  - "!**/.vscode/*"
  - "!src/*"
  - "!node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
# Tray icon must be a real file at runtime (the tray reads it from disk).
extraResources:
  - from: build/icon.png
    to: icons/icon.png
asarUnpack:
  - resources/**
  - node_modules/@node-rs/**
win:
  # Tighter compressor: smaller artifact, slightly slower first run.
  compression: maximum
  # Only these Chromium locales are shipped. Electron bundles 55 language packs
  # (~49 MB); the UI is English, so the rest are pure dead weight.
  electronLanguages:
    - en-US
  # icon.ico is generated by electron-builder from build/icon.png
  # (NSIS rejects all-PNG .ico files produced by png-to-ico)
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: true
  deleteAppDataOnUninstall: false
  # Hyphens, not the productName's space. electron-updater builds download URLs
  # from the file names in latest.yml; a space here becomes an unresolvable URL
  # on GitHub and every client's update check fails with a 404 — silently, with
  # no error shown to the user. Keep the artifact name URL-safe.
  artifactName: SSH-Vault-${version}-setup.${ext}
portable:
  artifactName: SSH-Vault-${version}-portable.${ext}
# Linux: AppImage is the most compatible "just run it" format; the deb/rpm
# packages cover the distro stores. No auto-update for AppImage on Linux
# (electron-updater supports it, but AppImage users typically update via
# package manager or re-download) — checks still report new versions.
linux:
  category: Utility
  # Explicit: the packaged binary and .desktop Exec are then deterministic
  # rather than derived from package name, and afterPack can find it.
  executableName: ssh-vault
  # icon.png is picked up from buildResources automatically (512px present).
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
  desktop:
    entry:
      Name: SSH Vault
      Comment: Secure, minimal SSH connection manager with an encrypted local vault
      Categories: Network;Utility;System;
appImage:
  artifactName: SSH-Vault-${version}-linux-x64.${ext}
deb:
  artifactName: SSH-Vault-${version}-linux-x64.${ext}
rpm:
  artifactName: SSH-Vault-${version}-linux-x64.${ext}
# macOS: unsigned (no certificate yet) — same situation as Windows until the
# project buys signing. dmg for Intel and Apple Silicon both: arm64 runs under
# Rosetta-free native build; x64 covers older Macs.
mac:
  category: public.app-category.utilities
  # Unsigned builds trip Gatekeeper; users clear it via System Settings →
  # Privacy & Security → "Open Anyway". identity: null skips signing cleanly.
  identity: null
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  electronLanguages:
    - en-US
dmg:
  artifactName: SSH-Vault-${version}-mac-${arch}.${ext}
afterPack: ./scripts/fuses.cjs
